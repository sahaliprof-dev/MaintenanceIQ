name: Contrôle qualité du site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liens, données structurées, titres, sitemap, AdSense
        run: python3 outils/check.py .
      - name: Installer le navigateur de test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pages en largeur téléphone (erreurs JavaScript, débordement)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          python3 outils/check_browser.py http://localhost:8765 .
      - name: Questionnaires, QCM et calculateurs
        run: python3 outils/check_interactif.py http://localhost:8765
