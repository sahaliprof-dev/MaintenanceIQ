<script>(function(){var B=[{"t": "general", "q": "Que signifie la lettre B au début d’un symbole ?", "o": ["Bâtiment", "Basse tension (et très basse tension)", "Brevet d’électricien"], "a": 1, "e": "B désigne le domaine basse et très basse tension ; H désigne la haute tension."}, {"t": "general", "q": "Un peintre doit repeindre un local électrique BT. Quelle habilitation ?", "o": ["B0", "B1", "BS"], "a": 0, "e": "Il réalise des travaux d’ordre non électrique : B0 suffit, il ne touche pas à l’installation."}, {"t": "general", "q": "Que veut dire la lettre V dans B1V ?", "o": ["Vérification", "Voisinage", "Véhicule"], "a": 1, "e": "V autorise à travailler au voisinage de pièces nues sous tension."}, {"t": "general", "q": "Quel symbole pour un technicien de maintenance qui dépanne des machines en BT ?", "o": ["B0", "BR", "BE Mesurage"], "a": 1, "e": "BR, chargé d’intervention générale : dépannage, raccordement, mesurage, essais, et consignation pour son propre compte."}, {"t": "general", "q": "Qui consigne une installation BT pour qu’une autre équipe y travaille ?", "o": ["Le chargé de consignation BC", "L’exécutant B1", "Le non-électricien B0"], "a": 0, "e": "La consignation pour le compte d’autrui revient au chargé de consignation BC (HC en haute tension)."}, {"t": "general", "q": "Remplacer un fusible ou une lampe sur un circuit simple : quel symbole minimum ?", "o": ["BS", "B2V", "HC"], "a": 0, "e": "BS couvre les interventions élémentaires sur des circuits BT de faible puissance."}, {"t": "general", "q": "Réarmer un disjoncteur et remettre une machine en marche relève de :", "o": ["BE Manœuvre", "BP", "BF-HF"], "a": 0, "e": "Les manœuvres d’exploitation relèvent du symbole BE Manœuvre."}, {"t": "general", "q": "Une entreprise creuse une tranchée près d’un câble enterré. Quel symbole ?", "o": ["B1V", "BF-HF", "BC"], "a": 1, "e": "BF-HF couvre les travaux en fouilles à proximité de canalisations isolées enterrées."}, {"t": "general", "q": "Que signifie la lettre T en troisième position ?", "o": ["Travaux sous tension", "Tableau électrique", "Technicien"], "a": 0, "e": "T désigne les travaux sous tension, qui demandent une formation spécifique."}, {"t": "general", "q": "Un mécanicien répare l’électronique de puissance d’une voiture électrique. Quelle norme ?", "o": ["NF C 18-510", "NF C 18-550", "NF C 15-100"], "a": 1, "e": "Les véhicules et engins à énergie électrique embarquée relèvent de la NF C 18-550 ; les symboles se terminent par L."}, {"t": "general", "q": "Qui délivre l’habilitation électrique ?", "o": ["L’organisme de formation", "L’employeur", "L’inspection du travail"], "a": 1, "e": "L’organisme forme et donne un avis ; c’est l’employeur qui délivre le titre d’habilitation à son salarié."}, {"t": "general", "q": "Tous les combien recommande-t-on un recyclage ?", "o": ["Tous les ans", "Tous les 3 ans", "Tous les 10 ans"], "a": 1, "e": "La norme recommande un recyclage tous les 3 ans au maximum, et plus tôt en cas de changement de poste ou d’incident."}, {"t": "b0", "q": "Que signifie le 0 dans B0 ?", "o": ["Zéro risque", "Personne non électricien", "Tension nulle"], "a": 1, "e": "Le chiffre 0 désigne une personne qui réalise des travaux d’ordre non électrique."}, {"t": "b0", "q": "Un titulaire B0 peut-il entrer dans un local réservé aux électriciens ?", "o": ["Oui, si c’est prévu sur son titre", "Jamais", "Seulement accompagné d’un client"], "a": 0, "e": "B0 est justement fait pour accéder à ces locaux et y faire un travail non électrique, dans les limites du titre."}, {"t": "b0", "q": "Un peintre B0 voit une lampe grillée dans le local. Que fait-il ?", "o": ["Il la change", "Il la signale", "Il coupe le disjoncteur et la change"], "a": 1, "e": "Changer une lampe est une intervention élémentaire : il faut au moins BS. Le B0 signale."}, {"t": "b0", "q": "Que change l’attribut « Chargé de chantier » ?", "o": ["Il autorise les opérations électriques", "Il autorise à diriger une équipe de non-électriciens", "Il autorise la haute tension"], "a": 1, "e": "Le chargé de chantier dirige les travaux non électriques et fait respecter les consignes de sécurité à son équipe."}, {"t": "b0", "q": "Un B0 peut-il entrer dans la zone de voisinage de pièces nues sous tension ?", "o": ["Oui", "Non", "Oui avec des gants"], "a": 1, "e": "Non. Le voisinage demande la lettre V (H0V en haute tension, B1V/B2V pour les électriciens)."}, {"t": "b0", "q": "Qui délivre l’habilitation B0 ?", "o": ["Le formateur", "L’employeur", "La mairie"], "a": 1, "e": "Le formateur donne un avis ; l’employeur délivre le titre par écrit."}, {"t": "b0", "q": "Tous les combien est recommandé le recyclage ?", "o": ["1 an", "3 ans", "5 ans"], "a": 1, "e": "La recommandation est un recyclage tous les 3 ans au plus."}, {"t": "b0", "q": "Pour réarmer un disjoncteur, quel symbole faut-il au minimum ?", "o": ["B0", "BE Manœuvre", "BF-HF"], "a": 1, "e": "Réarmer est une manœuvre : BE Manœuvre (ou BS)."}, {"t": "h0-h0v", "q": "Que désigne la lettre H ?", "o": ["Habilité", "Haute tension", "Hors tension"], "a": 1, "e": "H désigne le domaine haute tension."}, {"t": "h0-h0v", "q": "Quelle différence entre H0 et H0V ?", "o": ["Aucune", "V autorise le voisinage HT", "V veut dire vérification"], "a": 1, "e": "Le V autorise à travailler dans la zone de voisinage de la haute tension."}, {"t": "h0-h0v", "q": "Un H0V peut-il manœuvrer une cellule HT ?", "o": ["Oui", "Non", "Seulement en urgence"], "a": 1, "e": "Non. Les manœuvres HT demandent HE Manœuvre ou une habilitation d’électricien HT."}, {"t": "h0-h0v", "q": "À partir de quelle tension parle-t-on de haute tension en alternatif ?", "o": ["Au-delà de 400 V", "Au-delà de 1 000 V", "Au-delà de 50 000 V"], "a": 1, "e": "La haute tension commence au-delà de 1 000 V en alternatif (1 500 V en continu)."}, {"t": "h0-h0v", "q": "Un électricien BT qui entre dans un poste HT a-t-il besoin de H0 ?", "o": ["Oui", "Non, son habilitation BT suffit"], "a": 0, "e": "Oui : le risque HT existe dès qu’il entre dans le local, même pour un travail BT."}, {"t": "h0-h0v", "q": "Qui encadre une équipe de non-électriciens au voisinage HT ?", "o": ["Un H0V Chargé de chantier", "Un B0", "Un BS"], "a": 0, "e": "Le H0V Chargé de chantier dirige l’équipe et fait respecter les distances."}, {"t": "h0-h0v", "q": "Avant des travaux importants dans un poste HT, qui consigne ?", "o": ["Le H0V", "Le chargé de consignation HC", "Le peintre"], "a": 1, "e": "La consignation HT revient au chargé de consignation HC."}, {"t": "bf-hf", "q": "Que couvre BF-HF ?", "o": ["Les fours électriques", "Les travaux en fouilles près de câbles enterrés", "Les fusibles HT"], "a": 1, "e": "F pour fouilles : travaux à proximité de canalisations électriques isolées enterrées."}, {"t": "bf-hf", "q": "Quel texte a créé BF-HF ?", "o": ["La NF C 15-100", "L’amendement A1 de la NF C 18-510", "Le Code de la route"], "a": 1, "e": "BF-HF a été introduit par l’amendement A1 de la NF C 18-510."}, {"t": "bf-hf", "q": "Pendant le terrassement, la pelle découvre un câble. Première action ?", "o": ["Continuer prudemment", "Arrêter l’engin et signaler", "Couper le câble pour le dévier"], "a": 1, "e": "On arrête, on protège, on signale et on applique la consigne de l’exploitant du réseau."}, {"t": "bf-hf", "q": "Un titulaire BF-HF peut-il réparer un câble endommagé ?", "o": ["Oui", "Non"], "a": 1, "e": "Non : toute opération sur l’ouvrage électrique demande une habilitation d’électricien."}, {"t": "bf-hf", "q": "BF-HF remplace-t-il l’AIPR ?", "o": ["Oui", "Non, ce sont deux exigences différentes"], "a": 1, "e": "L’AIPR concerne les travaux près des réseaux ; BF-HF le risque électrique dans la fouille. Les deux peuvent être exigés."}, {"t": "bf-hf", "q": "Pourquoi les lettres B et H ensemble ?", "o": ["Le symbole couvre les câbles BT et HT", "B pour Bâtiment, H pour Hydraulique"], "a": 0, "e": "Le symbole couvre les canalisations basse et haute tension."}, {"t": "bf-hf", "q": "Qui organise le chantier selon les plans de réseaux ?", "o": ["Le chargé de chantier BF-HF", "L’exécutant BF-HF", "Le conducteur de pelle seul"], "a": 0, "e": "Le chargé de chantier BF-HF organise le chantier et fait appliquer les consignes."}, {"t": "b1-b1v", "q": "Que signifie le 1 dans B1 ?", "o": ["Niveau débutant", "Exécutant électricien", "Un seul circuit"], "a": 1, "e": "1 = exécutant de travaux d’ordre électrique."}, {"t": "b1-b1v", "q": "Que permet le V de B1V ?", "o": ["Vérifier", "Travailler au voisinage de pièces nues sous tension", "Travailler sur véhicule"], "a": 1, "e": "V = voisinage."}, {"t": "b1-b1v", "q": "Sur quoi un B1V travaille-t-il ?", "o": ["Une installation consignée", "Une installation sous tension", "N’importe quoi"], "a": 0, "e": "B1/B1V réalisent des travaux hors tension, sur un ouvrage consigné."}, {"t": "b1-b1v", "q": "Sous la direction de qui travaille le B1V ?", "o": ["Un BS", "Un chargé de travaux B2 / B2V", "Un B0"], "a": 1, "e": "L’exécutant suit les consignes du chargé de travaux."}, {"t": "b1-b1v", "q": "Un B1V peut-il consigner pour son équipe ?", "o": ["Oui", "Non, il faut BC"], "a": 1, "e": "Consigner pour autrui est le rôle du chargé de consignation BC."}, {"t": "b1-b1v", "q": "On signale au B1V qu’un moteur ne démarre plus. Peut-il dépanner seul ?", "o": ["Oui", "Non, le dépannage relève du BR"], "a": 1, "e": "Le dépannage seul relève du chargé d’intervention BR."}, {"t": "b1-b1v", "q": "B1V autorise-t-il les travaux sous tension ?", "o": ["Oui", "Non"], "a": 1, "e": "Non : il faut la lettre T et une formation spécifique."}, {"t": "b1-b1v", "q": "Durée courante de la formation initiale électricien BT ?", "o": ["1 jour", "3 jours", "3 semaines"], "a": 1, "e": "Les organismes la proposent en général en 3 jours, recyclage 1,5 jour."}, {"t": "b2-b2v", "q": "Que signifie le 2 dans B2 ?", "o": ["Deux personnes minimum", "Chargé de travaux", "Deuxième niveau de tension"], "a": 1, "e": "2 = chargé de travaux : il dirige et répond de la sécurité de l’équipe."}, {"t": "b2-b2v", "q": "Que reçoit le B2V avant de commencer ?", "o": ["L’attestation de consignation", "Le planning", "Un bon de commande"], "a": 0, "e": "Le chargé de consignation lui remet l’attestation de consignation."}, {"t": "b2-b2v", "q": "Que signe le B2V à la fin ?", "o": ["L’avis de fin de travail", "La facture", "L’attestation de consignation"], "a": 0, "e": "Il remet l’avis de fin de travail, qui permet la déconsignation."}, {"t": "b2-b2v", "q": "Que permet l’attribut Essai dans B2V Essai ?", "o": ["Réaliser des essais sur l’ouvrage", "Essayer le symbole pendant un mois"], "a": 0, "e": "Il autorise des essais avec remise sous tension contrôlée."}, {"t": "b2-b2v", "q": "Un B2V peut-il aussi exécuter les travaux ?", "o": ["Oui", "Non"], "a": 0, "e": "Oui : un chargé de travaux peut exécuter."}, {"t": "b2-b2v", "q": "Un B2V peut-il consigner pour son équipe sans autre symbole ?", "o": ["Oui", "Non, il faut aussi BC"], "a": 1, "e": "La consignation pour autrui demande BC."}, {"t": "b2-b2v", "q": "Qui délimite et balise la zone de travail ?", "o": ["Le chargé de travaux", "Le client", "Le B0"], "a": 0, "e": "Le chargé de travaux organise et balise la zone."}, {"t": "br", "q": "Que signifie R dans BR ?", "o": ["Réparation", "Intervention générale", "Réseau"], "a": 1, "e": "BR = chargé d’intervention générale en basse tension."}, {"t": "br", "q": "Lequel de ces actes relève du BR ?", "o": ["Rechercher une panne sur un moteur", "Diriger un chantier de câblage", "Consigner pour une autre équipe"], "a": 0, "e": "Le dépannage est le cœur du BR."}, {"t": "br", "q": "Pour qui le BR peut-il consigner ?", "o": ["Pour lui-même", "Pour n’importe quelle équipe", "Jamais"], "a": 0, "e": "Le BR consigne pour son propre compte ; pour autrui, il faut BC."}, {"t": "br", "q": "Un BR peut-il faire des mesures et des essais ?", "o": ["Oui", "Non"], "a": 0, "e": "Oui, mesurages, essais et vérifications font partie des interventions."}, {"t": "br", "q": "Un BR peut-il intervenir sur une cellule 20 kV ?", "o": ["Oui", "Non"], "a": 1, "e": "BR est limité à la basse tension."}, {"t": "br", "q": "Ordre correct avant de remplacer un contacteur ?", "o": ["Remplacer puis vérifier", "Consigner, vérifier l’absence de tension, remplacer", "Couper le disjoncteur et remplacer"], "a": 1, "e": "Consignation complète puis VAT avant toute intervention hors tension."}, {"t": "br", "q": "BR ou BS pour changer une lampe et c’est tout ?", "o": ["BS suffit", "BR obligatoire"], "a": 0, "e": "BS suffit pour une intervention élémentaire ; BR dès qu’il faut chercher une panne."}, {"t": "br", "q": "Avec quel outil vérifie-t-on l’absence de tension ?", "o": ["Un tournevis testeur", "Un VAT", "La main"], "a": 1, "e": "Le vérificateur d’absence de tension (VAT), contrôlé avant et après."}, {"t": "bs", "q": "BS s’adresse à :", "o": ["Des électriciens confirmés", "Des non-électriciens pour des interventions simples"], "a": 1, "e": "BS vise des non-électriciens qui font des opérations simples."}, {"t": "bs", "q": "Lequel est autorisé en BS ?", "o": ["Remplacer une prise à l’identique", "Changer un disjoncteur au tableau", "Dépanner un moteur"], "a": 0, "e": "Remplacement à l’identique de fusible, lampe, prise, interrupteur."}, {"t": "bs", "q": "Avant de remplacer un interrupteur, le BS :", "o": ["Travaille sous tension en faisant attention", "Met hors tension le circuit et vérifie", "Demande au client de ne rien toucher"], "a": 1, "e": "Il met hors tension pour son propre compte et vérifie l’absence de tension."}, {"t": "bs", "q": "Le tube neuf ne s’allume pas. Le BS :", "o": ["Ouvre le tableau pour chercher", "Appelle un électricien BR", "Change le ballast"], "a": 1, "e": "Chercher une panne sort de son champ : il appelle un BR."}, {"t": "bs", "q": "Un BS peut-il raccorder un appareil sur un circuit laissé en attente ?", "o": ["Oui", "Non"], "a": 0, "e": "Oui, c’est prévu dans les interventions élémentaires."}, {"t": "bs", "q": "BS est souvent délivré avec :", "o": ["BE Manœuvre", "H2V", "
